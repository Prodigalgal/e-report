# e-report/nginx.conf

map $http_x_envoy_external_address $trusted_client_address {
    default $http_x_envoy_external_address;
    "" $remote_addr;
}

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    client_max_body_size 60m;
    sendfile on;
    etag on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'" always;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    location = /service-worker.js {
        expires epoch;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /icons/ {
        expires 7d;
        try_files $uri =404;
    }

    location = /download/android {
        proxy_pass http://e-report-backend:8083/api/app-updates/latest/apk?platform=ANDROID&channel=stable;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_address;
        proxy_set_header X-Forwarded-For $trusted_client_address;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
    }

    location = /download/android-lite {
        proxy_pass http://e-report-backend:8083/api/app-updates/latest/apk?edition=LITE&platform=ANDROID&channel=stable;
        proxy_pass_request_headers on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_address;
        proxy_set_header X-Forwarded-For $trusted_client_address;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
    }

    location ~ ^/(?:e-report|e-report-backend)(?:/|$) {
        return 410;
    }

    # API 反向代理
    location ^~ /api/ {
        client_max_body_size 60m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://e-report-backend:8083;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_address;
        proxy_set_header X-Forwarded-For $trusted_client_address;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "";
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Gzip 压缩配置 (可选)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
