version: 2
updates:
  - package-ecosystem: npm
    directory: /e-report
    schedule:
      interval: weekly
      day: monday
      time: '22:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /e-report-app
    schedule:
      interval: weekly
      day: monday
      time: '23:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      expo-runtime:
        patterns: ['expo*', '@expo/*', 'react', 'react-dom', 'react-native', 'react-native-*']

  - package-ecosystem: gradle
    directory: /e-report-backen
    schedule:
      interval: weekly
      day: tuesday
      time: '22:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /e-report-app/android
    schedule:
      interval: weekly
      day: tuesday
      time: '23:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '22:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
