name: 构建 Android APK

on:
  workflow_run:
    workflows: [供应链安全]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: e-report-build-android-${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.display_title != 'CI 配置校验' && 'main' || github.event.workflow_run.id }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.display_title != 'CI 配置校验' }}

jobs:
  android-apk:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.display_title != 'CI 配置校验' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      E_REPORT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      E_REPORT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      E_REPORT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      E_REPORT_AMAP_ANDROID_KEY: ${{ secrets.ANDROID_AMAP_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: 确认当前 main 与通过审计的源码一致
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: e-report-app/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: 校验 APP 依赖与版本
        working-directory: e-report-app
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm run native:contract
          npm test
          npm run typecheck
          npm run security:assets
          npm run doctor
          node scripts/verify-version-contract.mjs
          node scripts/native-fingerprint.mjs
      - name: 查找不可变原生基础包
        id: foundation
        run: node scripts/release/native-artifact.mjs prepare --edition NATIVE --source-sha "$SOURCE_SHA" --output-dir .release-artifacts/android
      - name: 准备签名文件
        if: steps.foundation.outputs.reuse != 'true'
        run: |
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/e-report-upload.keystore"
          chmod 600 "$RUNNER_TEMP/e-report-upload.keystore"
          echo "E_REPORT_UPLOAD_STORE_FILE=$RUNNER_TEMP/e-report-upload.keystore" >> "$GITHUB_ENV"
      - name: 构建并验证签名 APK
        if: steps.foundation.outputs.reuse != 'true'
        working-directory: e-report-app/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain --no-parallel --no-daemon -Pkotlin.incremental=false
          apk="$PWD/app/build/outputs/apk/release/app-release.apk"
          contract=$(node ../scripts/verify-version-contract.mjs --app-root .. --apk "$apk" --android-sdk "$ANDROID_HOME")
          echo "$contract"
          signer=$(printf '%s' "$contract" | sed 's/^VERSION_CONTRACT=//' | jq -r '.apk.certificateSha256')
          test "$signer" = 'c63061845c0ca95444e9e9507338cc25284f2b5b022f6662bf85045371cb2d27'
          cd ../..
          node scripts/release/native-artifact.mjs seal --edition NATIVE --source-sha "$SOURCE_SHA" \
            --apk "$apk" --output-dir .release-artifacts/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e-report-android-${{ github.event.workflow_run.head_sha }}
          path: |
            .release-artifacts/android/app-release.apk
            .release-artifacts/android/release-manifest.json
          if-no-files-found: error
          retention-days: 30
