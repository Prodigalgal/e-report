name: 发布 Android 客户端制品

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      android_run_id:
        type: string
        required: true
      lite_run_id:
        type: string
        required: true
      ota_run_id:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish-apk:
    strategy:
      fail-fast: false
      matrix:
        edition: [NATIVE, LITE]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: e-report-app/package-lock.json
      - name: 安装 Native APK 校验依赖
        if: matrix.edition == 'NATIVE'
        working-directory: e-report-app
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: 下载同一候选的客户端制品
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION: ${{ matrix.edition }}
          NATIVE_RUN: ${{ inputs.android_run_id }}
          LITE_RUN: ${{ inputs.lite_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ "$EDITION" == NATIVE ]]; then component=android; run_id=$NATIVE_RUN; else component=lite; run_id=$LITE_RUN; fi
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n "e-report-$component-$SOURCE_SHA" -D .release-artifacts/client
      - name: 幂等发布 APK 并验证分发
        timeout-minutes: 160
        shell: pwsh
        env:
          EDITION: ${{ matrix.edition }}
          ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          APP_RELEASE_USERNAME: ${{ inputs.environment == 'test' && secrets.APP_RELEASE_TEST_USERNAME || secrets.APP_RELEASE_USERNAME }}
          APP_RELEASE_PASSWORD: ${{ inputs.environment == 'test' && secrets.APP_RELEASE_TEST_PASSWORD || secrets.APP_RELEASE_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if (-not $env:APP_RELEASE_USERNAME -or -not $env:APP_RELEASE_PASSWORD) { throw '缺少目标环境的发布凭证。' }
          ./scripts/release/publish-native-artifact.ps1 -Edition $env:EDITION -Environment $env:ENVIRONMENT `
            -SourceSha $env:SOURCE_SHA -ArtifactDirectory .release-artifacts/client -Username $env:APP_RELEASE_USERNAME `
            -Password (ConvertTo-SecureString $env:APP_RELEASE_PASSWORD -AsPlainText -Force)

  publish-ota:
    needs: publish-apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: e-report-app/package-lock.json
      - name: 下载并校验原始导出资源
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          OTA_RUN: ${{ inputs.ota_run_id }}
        run: |
          gh run download "$OTA_RUN" -R "$GITHUB_REPOSITORY" -n "e-report-ota-$SOURCE_SHA" -D .release-artifacts/ota
          cd e-report-app
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          node scripts/ota-export-manifest.mjs --export-root ../.release-artifacts/ota --source-sha "$SOURCE_SHA" --verify true
      - name: 为目标环境签署更新清单
        env:
          EXPO_OTA_PRIVATE_KEY: ${{ secrets.EXPO_OTA_PRIVATE_KEY }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$ENVIRONMENT" == test ]]; then origin='https://e-report-test.fantong.eu.org:60443'; else origin='https://e-report.fantong.eu.org:60443'; fi
          node e-report-app/scripts/pack-ota-update.mjs --environment "$ENVIRONMENT" --api-base-url "$origin/api" \
            --source-sha "$SOURCE_SHA" --created-at "$(git show -s --format=%cI "$SOURCE_SHA")" \
            --export-root .release-artifacts/ota --output .release-artifacts/ota-update.zip
      - name: 发布并等待资源全部分发
        shell: pwsh
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APP_RELEASE_USERNAME: ${{ inputs.environment == 'test' && secrets.APP_RELEASE_TEST_USERNAME || secrets.APP_RELEASE_USERNAME }}
          APP_RELEASE_PASSWORD: ${{ inputs.environment == 'test' && secrets.APP_RELEASE_TEST_PASSWORD || secrets.APP_RELEASE_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[IO.Compression.ZipFile]::OpenRead((Join-Path $PWD '.release-artifacts/ota-update.zip'))
          try {
            $reader=[IO.StreamReader]::new($zip.GetEntry('release.json').Open())
            try { $release=$reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $origin=if ($env:ENVIRONMENT -eq 'test') { 'https://e-report-test.fantong.eu.org:60443' } else { 'https://e-report.fantong.eu.org:60443' }
          ./e-report-app/scripts/publish-ota-update.ps1 -Username $env:APP_RELEASE_USERNAME `
            -Password (ConvertTo-SecureString $env:APP_RELEASE_PASSWORD -AsPlainText -Force) `
            -BaseUrl "$origin/api" -ArchivePath .release-artifacts/ota-update.zip -UpdateId $release.id
          node scripts/release/verify-ota-endpoint.mjs --api-base-url "$origin/api" --archive .release-artifacts/ota-update.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e-report-ota-signed-${{ inputs.environment }}-${{ inputs.source_sha }}
          path: .release-artifacts/ota-update.zip
          if-no-files-found: error
          retention-days: 30
