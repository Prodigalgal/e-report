            - name: APP_UPDATE_R2_ENABLED
              value: "true"
            - name: APP_UPDATE_R2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: e-report-r2
                  key: APP_R2_ACCOUNT_ID
            - name: APP_UPDATE_R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: e-report-r2
                  key: APP_R2_BUCKET
            - name: APP_UPDATE_R2_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: e-report-r2
                  key: APP_R2_API_TOKEN
            - name: APP_UPDATE_R2_PUBLIC_BASE_URL
              value: https://download.omnnu.xyz
            - name: APP_UPDATE_R2_OBJECT_PREFIX
              value: ""
            - name: API_CORS_ALLOWED_ORIGINS
              value: https://e-report.fantong.eu.org:60443,http://36.212.129.231:60080
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
