                  key: REDIS_PASSWORD
            - name: DEFAULT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: e-report-default-admin
                  key: DEFAULT_ADMIN_USERNAME
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e-report-default-admin
                  key: DEFAULT_ADMIN_PASSWORD
            - name: DEFAULT_ADMIN_PHONE
              valueFrom:
                secretKeyRef:
                  name: e-report-default-admin
                  key: DEFAULT_ADMIN_PHONE
                  optional: true
            - name: SUPER_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: e-report-super-admin
                  key: SUPER_ADMIN_USERNAME
                  optional: true
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e-report-super-admin
                  key: SUPER_ADMIN_PASSWORD
                  optional: true
            - name: SUPER_ADMIN_PHONE
              valueFrom:
                secretKeyRef:
                  name: e-report-super-admin
                  key: SUPER_ADMIN_PHONE
                  optional: true
            - name: AMAP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: e-report-external-integrations
