            - name: AUTH_CONTEXT_PEPPER
              valueFrom:
                secretKeyRef:
                  name: e-report-auth
                  key: AUTH_CONTEXT_PEPPER
            - name: ANDROID_EXPECTED_SIGNATURE_SHA256
              value: c63061845c0ca95444e9e9507338cc25284f2b5b022f6662bf85045371cb2d27
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: NOTIFICATION_CENTER_ENABLED
              valueFrom:
