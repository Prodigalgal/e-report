---
apiVersion: v1
kind: Service
metadata:
  name: e-report-backend
  namespace: e-report
spec:
  selector:
    app: e-report-backend
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-report-frontend
  namespace: e-report
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: e-report-frontend
  template:
    metadata:
      labels:
        app: e-report-frontend
    spec:
      containers:
        - name: frontend
          image: localhost/e-report-frontend:20260820-v2.5.3-permission-catalog-test-4
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: e-report-frontend
  namespace: e-report
spec:
  selector:
    app: e-report-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: e-report-mysql-backup
  namespace: e-report
spec:
  suspend: true
  schedule: "30 2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: docker.m.daocloud.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  umask 077
                  stamp="$(date +%Y%m%d-%H%M%S)"
                  target="/backups/fault_reporter_db-${stamp}.sql"
                  temporary="${target}.tmp"
                  mysqldump -h e-mysql -uroot \
                    --single-transaction \
                    --quick \
                    --routines \
                    --events \
                    --triggers \
                    --set-gtid-purged=OFF \
                    --no-tablespaces \
                    --databases fault_reporter_db > "${temporary}"
                  mv "${temporary}" "${target}"
                  find /backups -maxdepth 1 -type f -name 'fault_reporter_db-*.sql' -mtime +14 -delete
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: e-report-mysql
                      key: MYSQL_ROOT_PASSWORD
                - name: TZ
                  value: Asia/Shanghai
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              hostPath:
                path: /data/e-report/backups
                type: DirectoryOrCreate
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e-report
  namespace: e-report
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway-system
      sectionName: http
    - name: platform-gateway
      namespace: gateway-system
      sectionName: https-fantong
  hostnames:
    - e-report.fantong.eu.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: e-report-frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e-report-direct-ip
  namespace: e-report
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: e-report-frontend
          port: 80
