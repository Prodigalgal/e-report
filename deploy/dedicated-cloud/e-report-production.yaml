apiVersion: v1
kind: Namespace
metadata:
  name: e-report
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-mysql
  namespace: e-report
spec:
  # PostgreSQL 已成为唯一业务数据库；保留旧 MySQL 数据卷用于冷回退，禁止部署清单重新拉起实例。
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: e-mysql
  template:
    metadata:
      labels:
        app: e-mysql
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: docker.m.daocloud.io/library/mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: fault_reporter_db
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e-report-mysql
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          hostPath:
            path: /data/e-report/mysql
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: e-mysql
  namespace: e-report
spec:
  selector:
    app: e-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-report-redis
  namespace: e-report
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: e-report-redis
  template:
    metadata:
      labels:
        app: e-report-redis
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: docker.m.daocloud.io/library/redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --aof-use-rdb-preamble
            - "yes"
            - --auto-aof-rewrite-percentage
            - "100"
            - --auto-aof-rewrite-min-size
            - 64mb
            - --save
            - "60"
            - "1000"
            - --stop-writes-on-bgsave-error
            - "yes"
            - --tcp-keepalive
            - "60"
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - noeviction
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e-report-redis
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: e-report-redis
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: data
          hostPath:
            path: /data/e-report/redis
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: e-report-redis
  namespace: e-report
spec:
  selector:
    app: e-report-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
