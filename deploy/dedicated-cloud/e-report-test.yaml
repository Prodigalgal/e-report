    app.kubernetes.io/name: e-report-media-image-worker
    app.kubernetes.io/component: image-redaction
    app.kubernetes.io/version: "5.6.8"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: e-report-media-image-worker
  template:
    metadata:
      labels:
        app: e-report-media-image-worker
        app.kubernetes.io/component: image-redaction
        app.kubernetes.io/version: "5.6.8"
    spec:
      terminationGracePeriodSeconds: 180
      initContainers:
        - name: prepare-storage
          image: localhost/e-report-media-image-worker:20260903-v5.6.8-image-redaction-ocr-1
          imagePullPolicy: Never
          command: [sh, -c]
          args:
            - install -d -m 0750 -o 10001 -g 10001 /data/uploads/_quarantine /data/uploads/_sanitized
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
