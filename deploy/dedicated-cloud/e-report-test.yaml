            - name: IMAGE_REDACTION_MODEL_VERSION
              value: cmcc-brand-v2-focused
            - name: IMAGE_REDACTION_CONFIDENCE
              value: "0.65"
            - name: IMAGE_REDACTION_POLL_SECONDS
              value: "2"
            - name: IMAGE_REDACTION_LEASE_SECONDS
              value: "120"
            - name: IMAGE_REDACTION_MAX_FILE_BYTES
              value: "104857600"
            - name: IMAGE_REDACTION_MAX_PIXELS
              value: "40000000"
            - name: IMAGE_REDACTION_MAX_SIDE
              value: "12000"
            - name: IMAGE_REDACTION_PADDING_RATIO
              value: "0.05"
            - name: IMAGE_REDACTION_MAX_PADDING_PIXELS
              value: "16"
            - name: IMAGE_REDACTION_DENSE_SCAN
              value: "true"
            - name: IMAGE_REDACTION_OCR_ENABLED
              value: "true"
            - name: IMAGE_REDACTION_OCR_MAX_SIDE
              value: "2000"
            - name: IMAGE_REDACTION_OCR_MIN_CONFIDENCE
              value: "0.65"
            - name: IMAGE_REDACTION_STANDALONE_MODEL_CONFIDENCE
