---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: e-report-test-data-sync
  namespace: e-report-test
spec:
  suspend: true
  schedule: "30 3 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          serviceAccountName: e-report-test-sync
          restartPolicy: Never
          securityContext:
            fsGroup: 1001
          volumes:
            - name: sync
              emptyDir: {}
            - name: production-postgresql-backups
              hostPath:
                path: /data/e-report/postgresql-backups
                type: Directory
            - name: production-uploads
              hostPath:
                path: /data/e-report/uploads
                type: Directory
            - name: test-uploads
              hostPath:
                path: /data/e-report-test/uploads
                type: DirectoryOrCreate
          containers:
            - name: controller
              image: localhost/e-report-test-sync-kubectl:20260810-v1.0.42-ui-test-1
              imagePullPolicy: IfNotPresent
              command: [sh, -c]
              args:
                - |
                  set -eu
                  backend_replicas="$(kubectl -n e-report-test get deployment/e-report-backend -o jsonpath='{.spec.replicas}')"
                  printf '%s' "$backend_replicas" > /sync/backend-replicas
                  if kubectl -n e-report-test get deployment/e-report-media-image-worker >/dev/null 2>&1; then
                    worker_replicas="$(kubectl -n e-report-test get deployment/e-report-media-image-worker -o jsonpath='{.spec.replicas}')"
                    printf '%s' "$worker_replicas" > /sync/worker-replicas
                    kubectl -n e-report-test scale deployment/e-report-media-image-worker --replicas=0
                  fi
                  kubectl -n e-report-test scale deployment/e-report-backend --replicas=0
                  touch /sync/backend-stopped
                  while [ ! -f /sync/data-complete ] && [ ! -f /sync/data-failed ]; do sleep 2; done
                  while [ ! -f /sync/cache-complete ] && [ ! -f /sync/cache-failed ]; do sleep 2; done
                  while [ ! -f /sync/uploads-complete ] && [ ! -f /sync/uploads-failed ]; do sleep 2; done
                  kubectl -n e-report-test scale deployment/e-report-backend --replicas="$(cat /sync/backend-replicas)"
                  if [ -f /sync/worker-replicas ]; then
                    kubectl -n e-report-test scale deployment/e-report-media-image-worker --replicas="$(cat /sync/worker-replicas)"
                  fi
                  if [ "$(cat /sync/backend-replicas)" -gt 0 ]; then
                    kubectl -n e-report-test rollout status deployment/e-report-backend --timeout=300s
                  fi
                  if [ -f /sync/worker-replicas ] && [ "$(cat /sync/worker-replicas)" -gt 0 ]; then
                    kubectl -n e-report-test rollout status deployment/e-report-media-image-worker --timeout=300s
                  fi
                  touch /sync/backend-ready
                  test ! -f /sync/data-failed
                  test ! -f /sync/cache-failed
                  test ! -f /sync/uploads-failed
              volumeMounts:
                - name: sync
                  mountPath: /sync
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
            - name: postgresql-sync
              image: docker.m.daocloud.io/library/postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
              imagePullPolicy: IfNotPresent
              command: [sh, -c]
              args:
                - |
                  set -eu
                  trap 'touch /sync/data-failed' EXIT
                  while [ ! -f /sync/backend-stopped ]; do sleep 2; done
                  latest_dump="$(ls -1t /production-backups/fault_reporter_db-*.dump 2>/dev/null | head -n 1)"
                  test -n "$latest_dump"
                  test -s "$latest_dump"
                  if [ -f "$latest_dump.sha256" ]; then
                    (cd /production-backups && sha256sum -c "$(basename "$latest_dump.sha256")")
                  fi
                  pg_dump --format=custom --data-only \
                    --table=public.app_config \
                    --table=public.tenant_app_config \
                    --table=public.org_app_config \
                    --file=/sync/test-environment-config.dump
                  dropdb --maintenance-db=postgres --if-exists --force fault_reporter_db
                  createdb --maintenance-db=postgres --owner=e_report_migrator fault_reporter_db
                  pg_restore --exit-on-error --no-owner --no-acl \
                    --dbname=fault_reporter_db "$latest_dump"
                  touch /sync/import-complete
                  while [ ! -f /sync/schema-complete ] && [ ! -f /sync/schema-failed ]; do sleep 2; done
                  test ! -f /sync/schema-failed
                  psql --set=ON_ERROR_STOP=1 --dbname=fault_reporter_db <<'SQL'
                  TRUNCATE TABLE org_app_config, tenant_app_config, app_config RESTART IDENTITY;
                  TRUNCATE TABLE api_token_permissions, api_tokens, auth_sessions, trusted_devices,
                    outbox_events, daily_work_order_report_dispatches, client_observation_events,
                    command_idempotency_records RESTART IDENTITY CASCADE;
                  SQL
                  pg_restore --exit-on-error --no-owner --no-acl --data-only \
                    --dbname=fault_reporter_db /sync/test-environment-config.dump
                  rm -f /sync/test-environment-config.dump
                  rm -f /sync/data-failed
                  touch /sync/data-complete
                  trap - EXIT
              env:
                - name: PGHOST
                  value: e-postgresql-v5
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: fault_reporter_db
                - name: PGUSER
                  value: e_report_migrator
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: e-report-postgresql
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: sync
                  mountPath: /sync
