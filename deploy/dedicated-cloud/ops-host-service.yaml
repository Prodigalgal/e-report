apiVersion: v1
kind: Service
metadata:
  name: ops-web
  namespace: liangruishan
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/managed-by: kubectl
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 9002
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ops-web-host
  namespace: liangruishan
  labels:
    kubernetes.io/service-name: ops-web
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/managed-by: kubectl
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 9002
endpoints:
  - addresses:
      - 192.168.118.3
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ops-web
  namespace: liangruishan
  labels:
    app.kubernetes.io/name: ops-web
    app.kubernetes.io/managed-by: kubectl
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway-system
      sectionName: https-fantong-ops
  hostnames:
    - ops.fantong.eu.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ops-web
          port: 80
