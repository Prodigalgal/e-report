apiVersion: batch/v1
kind: Job
metadata:
  name: e-report-mysql-v5-source-upgrade-4
  namespace: e-report-test
  labels:
    app: e-report-liquibase
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/version: "5.0.9"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: e-report-liquibase
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/version: "5.0.9"
    spec:
      restartPolicy: Never
      containers:
        - name: liquibase
          image: localhost/e-report-database-migration:20260823-v5.0.9-authorization-v4-test-1
          imagePullPolicy: Never
          command:
            - java
            - -jar
            - /app/database-admin.jar
          env:
            - name: E_REPORT_MIGRATION_URL
              value: jdbc:mysql://e-mysql:3306/fault_reporter_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            - name: E_REPORT_MIGRATION_USERNAME
              value: root
            - name: E_REPORT_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e-report-mysql
                  key: MYSQL_ROOT_PASSWORD
            - name: E_REPORT_MIGRATION_CHANGELOG
              value: db/changelog/db.changelog-master.yaml
            - name: E_REPORT_MIGRATION_TAG
              value: v5.0.9-mysql-source-upgrade-test.1
            - name: DEFAULT_TENANT_GROUP_CODE
              value: FUJIAN_PROVINCE
            - name: DEFAULT_TENANT_GROUP_NAME
              value: 福建省公司
            - name: DEFAULT_TENANT_CODE
              value: DEFAULT_CITY
            - name: DEFAULT_TENANT_NAME
              value: 漳州市公司
            - name: DEFAULT_TENANT_ROOT_ORG_NAME
              value: 漳州市公司本部
            - name: DEFAULT_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: e-report-default-admin
                  key: DEFAULT_ADMIN_USERNAME
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
