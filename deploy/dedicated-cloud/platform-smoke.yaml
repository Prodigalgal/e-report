apiVersion: v1
kind: Namespace
metadata:
  name: platform-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-smoke
  namespace: platform-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-smoke
  template:
    metadata:
      labels:
        app: platform-smoke
    spec:
      imagePullSecrets:
        - name: registry-pull-secret
      containers:
        - name: http-echo
          image: registry.mnnu.eu.org/infra/busybox:e-report-smoke-20260804
          command:
            - sh
            - -c
            - mkdir -p /www && hostname > /www/hostname && printf 'ok\n' > /www/healthz && exec httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: platform-smoke
  namespace: platform-smoke
spec:
  selector:
    app: platform-smoke
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-smoke
  namespace: platform-smoke
spec:
  parentRefs:
    - name: platform-gateway
      namespace: gateway-system
      sectionName: http
    - name: platform-gateway
      namespace: gateway-system
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /platform-smoke
      backendRefs:
        - name: platform-smoke
          port: 80
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
