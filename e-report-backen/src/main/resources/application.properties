spring.application.name=e-report-backen
spring.application.version=6.8.2
server.port=8083
server.servlet.context-path=/api
server.forward-headers-strategy=framework
app.public-base-url=${APP_PUBLIC_BASE_URL:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fault_reporter_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:e_report_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
logging.level.org.springframework.security=WARN

# Spring/Micrometer 负责进程内 Observation 与 W3C Trace Context；所有远端 exporter 明确关闭。
management.tracing.propagation.type=W3C
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.opentelemetry.map-environment-variables=false
management.endpoints.enabled-by-default=false
management.opentelemetry.resource-attributes.service.name=e-report-backend
management.opentelemetry.resource-attributes.service.namespace=e-report
management.opentelemetry.resource-attributes.service.version=${spring.application.version}
management.opentelemetry.resource-attributes.deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:production}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jackson.time-zone=UTC
#spring.jpa.properties.hibernate.format_sql=false
spring.liquibase.change-log=classpath:db/changelog/postgresql/db.changelog-master.yaml
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}
spring.liquibase.parameters.defaultTenantGroupCode=${DEFAULT_TENANT_GROUP_CODE:FUJIAN_PROVINCE}
spring.liquibase.parameters.defaultTenantGroupName=${DEFAULT_TENANT_GROUP_NAME:\u798F\u5EFA\u7701\u516C\u53F8}
spring.liquibase.parameters.defaultTenantCode=${DEFAULT_TENANT_CODE:DEFAULT_CITY}
spring.liquibase.parameters.defaultTenantName=${DEFAULT_TENANT_NAME:\u6F33\u5DDE\u5E02\u516C\u53F8}
spring.liquibase.parameters.defaultTenantRootOrgName=${DEFAULT_TENANT_ROOT_ORG_NAME:\u6F33\u5DDE\u5E02\u516C\u53F8\u672C\u90E8}
spring.liquibase.parameters.defaultAdminUsername=${DEFAULT_ADMIN_USERNAME:admin}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:300MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:300MB}
api.cors.allowed-origins=${API_CORS_ALLOWED_ORIGINS:https://e-report.fantong.eu.org:60443,http://192.168.101.126:5173,http://localhost:5173,http://192.168.31.219:5173,https://httpwork.sophia.fr.eu.org}
file.upload-dir=./fault_uploads
app.image-redaction.max-attempts=${IMAGE_REDACTION_MAX_ATTEMPTS:3}
app.image-redaction.reconciler-enabled=${IMAGE_REDACTION_RECONCILER_ENABLED:true}
app.image-redaction.reconciler-initial-delay-ms=${IMAGE_REDACTION_RECONCILER_INITIAL_DELAY_MS:120000}
app.image-redaction.reconciler-interval-ms=${IMAGE_REDACTION_RECONCILER_INTERVAL_MS:300000}
app.image-redaction.reconciler-batch-size=${IMAGE_REDACTION_RECONCILER_BATCH_SIZE:50}
app.image-redaction.reconciler-max-batches-per-run=${IMAGE_REDACTION_RECONCILER_MAX_BATCHES_PER_RUN:2}
app.update.release-dir=${APP_UPDATE_RELEASE_DIR:./app_releases}
app.update.max-apk-size=${APP_UPDATE_MAX_APK_SIZE:300MB}
app.update.stable-download-url=${APP_UPDATE_STABLE_DOWNLOAD_URL:}
app.update.r2.enabled=${APP_UPDATE_R2_ENABLED:false}
app.update.r2.account-id=${APP_UPDATE_R2_ACCOUNT_ID:}
app.update.r2.bucket-name=${APP_UPDATE_R2_BUCKET_NAME:}
app.update.r2.api-token=${APP_UPDATE_R2_API_TOKEN:}
app.update.r2.public-base-url=${APP_UPDATE_R2_PUBLIC_BASE_URL:}
app.update.r2.object-prefix=${APP_UPDATE_R2_OBJECT_PREFIX:}
app.update.ota.enabled=${APP_UPDATE_OTA_ENABLED:false}
app.update.ota.environment=${DEPLOYMENT_ENVIRONMENT:production}

# 邮件服务器地址、账号和发件地址仅从通知中心的租户/组织配置读取。
app.mail.connection-timeout-ms=${MAIL_CONNECTION_TIMEOUT_MS:10000}
app.mail.read-timeout-ms=${MAIL_READ_TIMEOUT_MS:30000}
app.mail.write-timeout-ms=${MAIL_WRITE_TIMEOUT_MS:30000}
notification.center.enabled=${NOTIFICATION_CENTER_ENABLED:false}
notification.delivery-enabled=${NOTIFICATION_DELIVERY_ENABLED:true}
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
app.notification.email.recipient-allowlist-user-ids=${APP_NOTIFICATION_EMAIL_RECIPIENT_ALLOWLIST_USER_IDS:}
notification.wecom.enabled=${NOTIFICATION_WECOM_ENABLED:false}
notification.wecom.webhook-url=${NOTIFICATION_WECOM_WEBHOOK_URL:}
notification.dingtalk.enabled=${NOTIFICATION_DINGTALK_ENABLED:false}
notification.dingtalk.webhook-url=${NOTIFICATION_DINGTALK_WEBHOOK_URL:}
notification.dingtalk.secret=${NOTIFICATION_DINGTALK_SECRET:}
notification.daily-outstanding-report.enabled=${NOTIFICATION_DAILY_OUTSTANDING_REPORT_ENABLED:false}
notification.daily-outstanding-report.send-time=${NOTIFICATION_DAILY_OUTSTANDING_REPORT_SEND_TIME:18:00}
app.outbox.enqueue-enabled=${APP_OUTBOX_ENQUEUE_ENABLED:true}
app.outbox.enabled=${APP_OUTBOX_ENABLED:true}
app.daily-outstanding-report.scheduler-enabled=${DAILY_OUTSTANDING_REPORT_SCHEDULER_ENABLED:true}
app.daily-outstanding-report.catch-up-window-minutes=${DAILY_OUTSTANDING_REPORT_CATCH_UP_WINDOW_MINUTES:180}
app.daily-outstanding-report.claim-timeout-minutes=${DAILY_OUTSTANDING_REPORT_CLAIM_TIMEOUT_MINUTES:60}
app.bootstrap-super-admin.username=${SUPER_ADMIN_USERNAME:}
app.bootstrap-super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.bootstrap-super-admin.phone=${SUPER_ADMIN_PHONE:}
app.system-authorization-baseline.enabled=${SYSTEM_AUTHORIZATION_BASELINE_ENABLED:true}
app.auth-token.secret=${AUTH_TOKEN_SECRET:local-development-token-secret-change-in-production}
app.auth-token.ttl-seconds=${AUTH_TOKEN_TTL_SECONDS:900}
app.security.context-pepper=${AUTH_CONTEXT_PEPPER:local-development-context-pepper-change-in-production}
app.security.android.expected-signature-sha256=${ANDROID_EXPECTED_SIGNATURE_SHA256:}
app.security.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.security.auth-rate-limit.challenge.global-per-minute=${AUTH_CHALLENGE_GLOBAL_PER_MINUTE:1200}
app.security.auth-rate-limit.challenge.ip-per-minute=${AUTH_CHALLENGE_IP_PER_MINUTE:300}
app.security.auth-rate-limit.challenge.account-per-minute=${AUTH_CHALLENGE_ACCOUNT_PER_MINUTE:12}
app.security.auth-rate-limit.challenge.device-per-minute=${AUTH_CHALLENGE_DEVICE_PER_MINUTE:30}
app.security.auth-rate-limit.login.global-per-minute=${AUTH_LOGIN_GLOBAL_PER_MINUTE:600}
app.security.auth-rate-limit.login.ip-per-minute=${AUTH_LOGIN_IP_PER_MINUTE:300}
app.security.auth-rate-limit.login.account-per-minute=${AUTH_LOGIN_ACCOUNT_PER_MINUTE:10}
app.security.auth-rate-limit.login.device-per-minute=${AUTH_LOGIN_DEVICE_PER_MINUTE:20}
app.security.authentication-hash.maximum-concurrent=${AUTH_HASH_MAXIMUM_CONCURRENT:4}
app.security.authentication-hash.maximum-queued=${AUTH_HASH_MAXIMUM_QUEUED:32}
app.security.authentication-hash.wait-timeout-seconds=${AUTH_HASH_WAIT_TIMEOUT_SECONDS:5}
app.security.authentication-hash.retry-after-seconds=${AUTH_HASH_RETRY_AFTER_SECONDS:2}
app.security.api-token.rate-limit.per-minute=${API_TOKEN_RATE_LIMIT_PER_MINUTE:300}
app.auth-session.retention-enabled=${AUTH_SESSION_RETENTION_ENABLED:true}
app.auth-session.retention-cron=${AUTH_SESSION_RETENTION_CRON:0 35 3 * * *}
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

amap.api.key=${AMAP_API_KEY:}
appconfig.initial.amap_key=${amap.api.key}
map.amap.api-key-pool=${appconfig.initial.amap_key}

spring.cache.type=redis
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.client-name=${SPRING_DATA_REDIS_CLIENT_NAME:e-report-backend}
spring.data.redis.repositories.enabled=false
spring.data.redis.lettuce.shutdown-timeout=2s
