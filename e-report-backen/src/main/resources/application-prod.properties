spring.datasource.url=jdbc:mysql://e-mysql:3306/fault_reporter_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
app.auth-token.secret=${AUTH_TOKEN_SECRET}
app.security.context-pepper=${AUTH_CONTEXT_PEPPER}
app.security.android.expected-signature-sha256=${ANDROID_EXPECTED_SIGNATURE_SHA256}
app.security.cookie-secure=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
