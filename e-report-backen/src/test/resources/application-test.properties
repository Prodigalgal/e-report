spring.datasource.url=jdbc:h2:mem:e_report_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.cache.type=simple
app.daily-outstanding-report.scheduler-enabled=false
appconfig.initial.admin_phones=
amap.api.key=test-key
appconfig.initial.amap_key=${amap.api.key}
file.upload-dir=./build/test-work-order-uploads
app.update.release-dir=./build/test-app-releases
app.update.max-apk-size=300MB
app.auth-session.retention-enabled=false
app.user-transfer.recovery-initial-delay-ms=3600000
app.user-transfer.retention-initial-delay-ms=3600000
app.user-search-key-backfill.initial-delay-ms=3600000
